<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-label="Tesla Powerwall 3">
  <defs>
    <linearGradient id="pw-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f7f8"/>
      <stop offset="45%" stop-color="#ececee"/>
      <stop offset="100%" stop-color="#d8d8dc"/>
    </linearGradient>
    <linearGradient id="pw-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pw-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="pw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="240" cy="520" rx="150" ry="22" fill="#000" opacity="0.22"/>

  <g filter="url(#pw-glow)">
    <rect x="110" y="70" width="260" height="420" rx="18" fill="url(#pw-body)" stroke="#b8b8be" stroke-width="2"/>
    <rect x="118" y="78" width="244" height="404" rx="14" fill="url(#pw-shine)" opacity="0.55"/>
    <rect x="110" y="330" width="260" height="160" rx="18" fill="url(#pw-shadow)"/>

    <rect x="150" y="120" width="180" height="250" rx="10" fill="#f2f2f4" stroke="#c8c8ce" stroke-width="1.5"/>
    <rect x="165" y="140" width="150" height="18" rx="4" fill="#e82127" opacity="0.9"/>
    <rect x="165" y="175" width="110" height="8" rx="4" fill="#d0d0d4"/>
    <rect x="165" y="198" width="130" height="8" rx="4" fill="#d0d0d4"/>
    <rect x="165" y="221" width="95" height="8" rx="4" fill="#d0d0d4"/>

    <circle cx="318" cy="150" r="10" fill="#34c759"/>
    <circle cx="318" cy="150" r="5" fill="#9ff0b1"/>

    <rect x="150" y="390" width="70" height="56" rx="8" fill="#e4e4e8" stroke="#c0c0c6"/>
    <rect x="230" y="390" width="70" height="56" rx="8" fill="#e4e4e8" stroke="#c0c0c6"/>
    <rect x="310" y="390" width="20" height="56" rx="6" fill="#d8d8dc" stroke="#c0c0c6"/>

    <path d="M185 455 H295" stroke="#b0b0b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 468 H280" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="240" y="535" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ececee">Powerwall 3</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Tesla Fleet API architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#141010"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e31937"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffcb05"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="none" stroke="#2a2a30" stroke-width="1"/>

  <text x="48" y="58" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">GAMING-HUB - TESLA STACK</text>
  <text x="48" y="88" fill="#e8e8ec" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">WordPress + Fleet API + tesla-http-proxy</text>

  <g transform="translate(48,130)">
    <rect width="150" height="72" rx="10" fill="url(#box)" stroke="#3a3a42"/>
    <text x="75" y="32" text-anchor="middle" fill="#b8b8c0" font-family="ui-monospace, Menlo, monospace" font-size="14">Browser</text>
    <text x="75" y="54" text-anchor="middle" fill="#6a6a72" font-family="ui-monospace, Menlo, monospace" font-size="11">Tesla dashboard</text>
  </g>

  <g transform="translate(280,110)">
    <rect width="280" height="112" rx="12" fill="url(#box)" stroke="#e31937" stroke-width="1.5"/>
    <text x="20" y="30" fill="#e31937" font-family="ui-monospace, Menlo, monospace" font-size="13">WordPress (PHP)</text>
    <text x="20" y="54" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">tesla-api.php | tesla-plan | charge-log</text>
    <text x="20" y="72" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">OAuth callback | WP-Cron | gas-log</text>
    <text x="20" y="90" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="10">poll idle 15m | active 10m | sleep skip 30m</text>
  </g>

  <g transform="translate(280,260)">
    <rect width="280" height="88" rx="10" fill="#101014" stroke="#ffcb05" stroke-dasharray="6 4"/>
    <text x="20" y="28" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="12">/.well-known/appspecific/</text>
    <text x="20" y="48" fill="#a8a8b0" font-family="ui-monospace, Menlo, monospace" font-size="10">com.tesla.3p.public-key.pem</text>
    <text x="20" y="64" fill="#a8a8b0" font-family="ui-monospace, Menlo, monospace" font-size="10">partner_accounts registration required</text>
  </g>

  <g transform="translate(640,110)">
    <rect width="240" height="112" rx="12" fill="url(#box)" stroke="#5b8cff" stroke-width="1.5"/>
    <text x="20" y="30" fill="#5b8cff" font-family="ui-monospace, Menlo, monospace" font-size="13">Fleet API (NA region)</text>
    <text x="20" y="54" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">fleet-api.prd.na.vn.cloud.tesla.com</text>
    <text x="20" y="72" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">vehicle_data | wake_up</text>
    <text x="20" y="90" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="10">OAuth: fleet-auth.prd.vn.cloud.tesla.com</text>
  </g>

  <g transform="translate(640,260)">
    <rect width="240" height="88" rx="10" fill="url(#box)" stroke="#e31937"/>
    <text x="20" y="28" fill="#e31937" font-family="ui-monospace, Menlo, monospace" font-size="12">tesla-http-proxy</text>
    <text x="20" y="48" fill="#a8a8b0" font-family="ui-monospace, Menlo, monospace" font-size="10">signed commands only</text>
    <text x="20" y="64" fill="#a8a8b0" font-family="ui-monospace, Menlo, monospace" font-size="10">charge_start | stop | set_charge_limit</text>
    <text x="20" y="80" fill="#6a6a74" font-family="ui-monospace, Menlo, monospace" font-size="10">TESLA_COMMAND_PROXY_URL</text>
  </g>

  <g transform="translate(940,160)">
    <rect width="200" height="120" rx="12" fill="url(#box)" stroke="#e31937"/>
    <text x="20" y="34" fill="#e8e8ec" font-family="ui-monospace, Menlo, monospace" font-size="13">Model 3</text>
    <text x="20" y="56" fill="#e31937" font-family="ui-monospace, Menlo, monospace" font-size="11">Fleet vehicle_data</text>
    <text x="20" y="78" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="10">SOC | charge | drive</text>
    <text x="20" y="98" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="10">virtual key for commands</text>
  </g>

  <line x1="198" y1="166" x2="278" y2="166" stroke="#e31937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="222" x2="420" y2="258" stroke="#ffcb05" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <line x1="560" y1="166" x2="638" y2="166" stroke="#e31937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="304" x2="638" y2="304" stroke="#e31937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="166" x2="938" y2="200" stroke="#5b8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="304" x2="938" y2="250" stroke="#e31937" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(48,400)">
    <rect width="1104" height="220" rx="14" fill="#0e0e12" stroke="#2a2a30"/>
    <text x="24" y="36" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="12">DATA PLANE</text>
    <text x="24" y="68" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">1. Read: PHP -&gt; OAuth refresh -&gt; GET vehicle_data (skip when asleep)</text>
    <text x="24" y="92" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">2. Write: PHP -&gt; tesla-http-proxy -&gt; signed command/* (virtual key required)</text>
    <text x="24" y="116" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">3. Partner: public key on production domain + partner_accounts (localhost alone fails)</text>
    <text x="24" y="152" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="12">NORMALIZE</text>
    <text x="24" y="180" fill="#a8a8b0" font-family="ui-monospace, Menlo, monospace" font-size="11">model3 status -&gt; battery | charge_state | odometer | cabin | tires | drive</text>
    <text x="24" y="204" fill="#6a6a74" font-family="ui-monospace, Menlo, monospace" font-size="10">JP accounts use NA Fleet region | location scope optional and stripped from storage</text>
  </g>
</svg>

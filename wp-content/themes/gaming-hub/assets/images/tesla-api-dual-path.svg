<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Tesla Fleet read vs signed command paths">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#140e0e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg2)"/>

  <text x="40" y="48" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">DUAL PATH</text>
  <text x="40" y="78" fill="#e8e8ec" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Fleet read (REST) vs signed commands (proxy)</text>

  <g transform="translate(40,110)">
    <rect width="540" height="460" rx="16" fill="#121216" stroke="#5b8cff" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="44" rx="16" fill="#5b8cff" opacity="0.12"/>
    <text x="24" y="30" fill="#5b8cff" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">PATH A - READ</text>

    <text x="24" y="78" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="11">CREDENTIALS</text>
    <text x="24" y="98" fill="#d0d0d8" font-family="ui-monospace, Menlo, monospace" font-size="11">TESLA_CLIENT_ID / CLIENT_SECRET</text>
    <text x="24" y="116" fill="#d0d0d8" font-family="ui-monospace, Menlo, monospace" font-size="11">TESLA_VEHICLE_VIN | refresh_token</text>

    <text x="24" y="152" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="11">OAUTH</text>
    <rect x="24" y="162" width="492" height="56" rx="8" fill="#0a0a10" stroke="#2a3444"/>
    <text x="36" y="184" fill="#7aa8ff" font-family="ui-monospace, Menlo, monospace" font-size="11">/wp-json/gaming-hub/v1/tesla/oauth/callback</text>
    <text x="36" y="204" fill="#a8b8c8" font-family="ui-monospace, Menlo, monospace" font-size="10">scopes: vehicle_device_data | vehicle_cmds | optional location</text>

    <text x="24" y="248" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="11">READ</text>
    <rect x="24" y="258" width="492" height="72" rx="8" fill="#0a0a10" stroke="#2a3444"/>
    <text x="36" y="280" fill="#7aa8ff" font-family="ui-monospace, Menlo, monospace" font-size="11">GET /api/1/vehicles/{vin}/vehicle_data</text>
    <text x="36" y="300" fill="#a8b8c8" font-family="ui-monospace, Menlo, monospace" font-size="10">charge_state | drive_state | climate | vehicle_state</text>
    <text x="36" y="318" fill="#a8b8c8" font-family="ui-monospace, Menlo, monospace" font-size="10">asleep =&gt; show last snapshot, do not wake for poll</text>

    <text x="24" y="360" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="11">PHP</text>
    <text x="24" y="380" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">Gaming_Hub_Tesla_Api</text>
    <text x="24" y="398" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">inc/tesla.php | gas-log | charge-log</text>

    <text x="24" y="434" fill="#6a7a8a" font-family="ui-monospace, Menlo, monospace" font-size="10">Japan: TESLA_FLEET_API_BASE_URL = fleet-api.prd.na.vn.cloud.tesla.com</text>
  </g>

  <g transform="translate(620,110)">
    <rect width="540" height="460" rx="16" fill="#141010" stroke="#e31937" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="44" rx="16" fill="#e31937" opacity="0.12"/>
    <text x="24" y="30" fill="#e31937" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">PATH B - WRITE</text>

    <text x="24" y="78" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="11">PROXY</text>
    <text x="24" y="98" fill="#d0d0d8" font-family="ui-monospace, Menlo, monospace" font-size="11">TESLA_COMMAND_PROXY_URL</text>
    <text x="24" y="116" fill="#d0d0d8" font-family="ui-monospace, Menlo, monospace" font-size="11">docker: tesla/vehicle-command</text>

    <text x="24" y="152" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="11">COMMANDS (signed)</text>
    <rect x="24" y="162" width="492" height="72" rx="8" fill="#120a0a" stroke="#3a2428"/>
    <text x="36" y="184" fill="#ff6b7a" font-family="ui-monospace, Menlo, monospace" font-size="11">POST /api/1/vehicles/{vin}/command/...</text>
    <text x="36" y="204" fill="#a8a8b0" font-family="ui-monospace, Menlo, monospace" font-size="10">charge_start | charge_stop | set_charge_limit</text>
    <text x="36" y="222" fill="#a8a8b0" font-family="ui-monospace, Menlo, monospace" font-size="10">unsigned Fleet command = rejected</text>

    <text x="24" y="264" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="11">PREREQS</text>
    <rect x="24" y="274" width="492" height="56" rx="8" fill="#120a0a" stroke="#3a2428"/>
    <text x="36" y="296" fill="#ff6b7a" font-family="ui-monospace, Menlo, monospace" font-size="11">virtual key paired in Tesla app</text>
    <text x="36" y="316" fill="#a8a8b0" font-family="ui-monospace, Menlo, monospace" font-size="10">partner public key hosted on Allowed Origins domain</text>

    <text x="24" y="360" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="11">PLAN</text>
    <text x="24" y="380" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">inc/tesla-plan.php AI PLAN</text>
    <text x="24" y="398" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">diff-only charge window | wake budget 4/day</text>

    <text x="24" y="434" fill="#6a6a74" font-family="ui-monospace, Menlo, monospace" font-size="10">Do not merge paths - read stays on Fleet, write goes via proxy</text>
  </g>

  <text x="600" y="598" text-anchor="middle" fill="#6a6a72" font-family="ui-monospace, Menlo, monospace" font-size="11">gaming_hub_tesla_get_api() | refresh token | ensure Fleet base URL</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="e Vitara to Model 3 power bridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#141010"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffcb05"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e31937"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="352" rx="16" fill="none" stroke="#2a2a30" stroke-width="1"/>

  <text x="48" y="58" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">EV-TO-EV BRIDGE</text>
  <text x="48" y="88" fill="#e8e8ec" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">e Vitara to home wiring to Model 3</text>

  <g transform="translate(48,130)">
    <rect width="200" height="120" rx="12" fill="url(#box)" stroke="#ffcb05" stroke-width="1.5"/>
    <text x="20" y="36" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="14">e Vitara</text>
    <text x="20" y="58" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">61 kWh / V2H discharge</text>
    <text x="20" y="78" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="10">daytime solar stored in EV</text>
    <text x="20" y="98" fill="#6a6a74" font-family="ui-monospace, Menlo, monospace" font-size="10">DC to AC approx 91%</text>
  </g>

  <g transform="translate(300,130)">
    <rect width="240" height="120" rx="12" fill="url(#box)" stroke="#5b8cff"/>
    <text x="20" y="36" fill="#5b8cff" font-family="ui-monospace, Menlo, monospace" font-size="13">V2H + panel</text>
    <text x="20" y="58" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">in-home AC wiring</text>
    <text x="20" y="78" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="10">reuse existing 200 V circuit</text>
    <text x="20" y="98" fill="#6a6a74" font-family="ui-monospace, Menlo, monospace" font-size="10">cheaper than grid import</text>
  </g>

  <g transform="translate(592,130)">
    <rect width="200" height="120" rx="12" fill="url(#box)" stroke="#e31937"/>
    <text x="20" y="36" fill="#e31937" font-family="ui-monospace, Menlo, monospace" font-size="13">200 V outlet</text>
    <text x="20" y="58" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">outdoor AC charge</text>
    <text x="20" y="78" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="10">approx 3 kW</text>
    <text x="20" y="98" fill="#6a6a74" font-family="ui-monospace, Menlo, monospace" font-size="10">AC to DC approx 86%</text>
  </g>

  <g transform="translate(844,130)">
    <rect width="200" height="120" rx="12" fill="url(#box)" stroke="#e31937" stroke-width="1.5"/>
    <text x="20" y="36" fill="#e31937" font-family="ui-monospace, Menlo, monospace" font-size="14">Model 3</text>
    <text x="20" y="58" fill="#c8c8d0" font-family="ui-monospace, Menlo, monospace" font-size="11">sub EV charge</text>
    <text x="20" y="78" fill="#8a8a98" font-family="ui-monospace, Menlo, monospace" font-size="10">Fleet API / AI PLAN</text>
    <text x="20" y="98" fill="#6a6a74" font-family="ui-monospace, Menlo, monospace" font-size="10">time-of-use amp control</text>
  </g>

  <line x1="248" y1="190" x2="298" y2="190" stroke="#ffcb05" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="190" x2="590" y2="190" stroke="#ffcb05" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="792" y1="190" x2="842" y2="190" stroke="#e31937" stroke-width="2" marker-end="url(#arrow-red)"/>

  <g transform="translate(48,290)">
    <rect width="1104" height="68" rx="12" fill="#0e0e12" stroke="#2a2a30"/>
    <text x="24" y="28" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="12">Round-trip efficiency (typical)</text>
    <text x="24" y="50" fill="#a8a8b0" font-family="ui-monospace, Menlo, monospace" font-size="11">V2H 91% x onboard charger 86% = 75-80% - still cheaper than 45 JPY/kWh grid import</text>
  </g>
</svg>

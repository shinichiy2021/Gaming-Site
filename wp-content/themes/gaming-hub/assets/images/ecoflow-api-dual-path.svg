<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="EcoFlow Pro 3 REST vs Delta 1500 MQTT">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a100e"/>
      <stop offset="100%" stop-color="#100c0a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg2)"/>

  <text x="40" y="48" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">DUAL PATH</text>
  <text x="40" y="78" fill="#e8efe9" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Pro 3 (REST) vs Delta 1500 (MQTT)</text>

  <g transform="translate(40,110)">
    <rect width="540" height="460" rx="16" fill="#101814" stroke="#00c853" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="44" rx="16" fill="#00c853" opacity="0.15"/>
    <text x="24" y="30" fill="#00c853" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">PATH A - DELTA Pro 3</text>

    <text x="24" y="78" fill="#8aa898" font-family="ui-monospace, Menlo, monospace" font-size="11">CREDENTIALS</text>
    <text x="24" y="98" fill="#d0e0d4" font-family="ui-monospace, Menlo, monospace" font-size="11">ECOFLOW_ACCESS_KEY / SECRET_KEY</text>
    <text x="24" y="116" fill="#d0e0d4" font-family="ui-monospace, Menlo, monospace" font-size="11">ECOFLOW_DEVICE_SN | REGION=a</text>

    <text x="24" y="152" fill="#8aa898" font-family="ui-monospace, Menlo, monospace" font-size="11">READ</text>
    <rect x="24" y="162" width="492" height="56" rx="8" fill="#0a120e" stroke="#2a4034"/>
    <text x="36" y="184" fill="#6bdc8a" font-family="ui-monospace, Menlo, monospace" font-size="11">GET /iot-open/sign/device/quota/all?sn=...</text>
    <text x="36" y="204" fill="#a8b8ac" font-family="ui-monospace, Menlo, monospace" font-size="10">powInSumW | powOutSumW | bmsChgDsgState | mppt.inWatts</text>

    <text x="24" y="248" fill="#8aa898" font-family="ui-monospace, Menlo, monospace" font-size="11">WRITE (schedule diff only)</text>
    <rect x="24" y="258" width="492" height="72" rx="8" fill="#0a120e" stroke="#2a4034"/>
    <text x="36" y="280" fill="#6bdc8a" font-family="ui-monospace, Menlo, monospace" font-size="11">PUT /iot-open/sign/device/quota</text>
    <text x="36" y="300" fill="#a8b8ac" font-family="ui-monospace, Menlo, monospace" font-size="10">cfgPlugInInfoAcInChgPowMax: 0 | 1000</text>
    <text x="36" y="318" fill="#a8b8ac" font-family="ui-monospace, Menlo, monospace" font-size="10">Energy Backup reserve SOC toggle</text>

    <text x="24" y="360" fill="#8aa898" font-family="ui-monospace, Menlo, monospace" font-size="11">PHP</text>
    <text x="24" y="380" fill="#c8d8cc" font-family="ui-monospace, Menlo, monospace" font-size="11">Gaming_Hub_Ecoflow_Api</text>
    <text x="24" y="398" fill="#c8d8cc" font-family="ui-monospace, Menlo, monospace" font-size="11">inc/ecoflow-schedule.php</text>

    <text x="24" y="434" fill="#6a8a74" font-family="ui-monospace, Menlo, monospace" font-size="10">Developer API quota is non-empty for Pro 3 SN prefixes</text>
  </g>

  <g transform="translate(620,110)">
    <rect width="540" height="460" rx="16" fill="#101418" stroke="#5b8cff" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="44" rx="16" fill="#5b8cff" opacity="0.12"/>
    <text x="24" y="30" fill="#5b8cff" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">PATH B - DELTA 3 1500</text>

    <text x="24" y="78" fill="#8aa898" font-family="ui-monospace, Menlo, monospace" font-size="11">CREDENTIALS</text>
    <text x="24" y="98" fill="#d0e0d4" font-family="ui-monospace, Menlo, monospace" font-size="11">ECOFLOW_APP_EMAIL / APP_PASSWORD</text>
    <text x="24" y="116" fill="#d0e0d4" font-family="ui-monospace, Menlo, monospace" font-size="11">ECOFLOW_DEVICE_SN_2 | D361/D362/D381</text>

    <text x="24" y="152" fill="#8aa898" font-family="ui-monospace, Menlo, monospace" font-size="11">READ (MQTT bridge)</text>
    <rect x="24" y="162" width="492" height="72" rx="8" fill="#0a0e14" stroke="#2a3444"/>
    <text x="36" y="184" fill="#7aa8ff" font-family="ui-monospace, Menlo, monospace" font-size="11">App Login -&gt; mqtts:// broker -&gt; subscribe quota</text>
    <text x="36" y="204" fill="#a8b8c8" font-family="ui-monospace, Menlo, monospace" font-size="10">write ecoflow-cache/{SN}.json</text>
    <text x="36" y="222" fill="#a8b8c8" font-family="ui-monospace, Menlo, monospace" font-size="10">bridge-status.json | live if &lt; 90s</text>

    <text x="24" y="264" fill="#8aa898" font-family="ui-monospace, Menlo, monospace" font-size="11">WRITE (file IPC)</text>
    <rect x="24" y="274" width="492" height="56" rx="8" fill="#0a0e14" stroke="#2a3444"/>
    <text x="36" y="296" fill="#7aa8ff" font-family="ui-monospace, Menlo, monospace" font-size="11">PHP -&gt; bridge-command.json</text>
    <text x="36" y="316" fill="#a8b8c8" font-family="ui-monospace, Menlo, monospace" font-size="10">daemon publish | bridge-command-result.json</text>

    <text x="24" y="360" fill="#8aa898" font-family="ui-monospace, Menlo, monospace" font-size="11">NODE</text>
    <text x="24" y="380" fill="#c8d8dc" font-family="ui-monospace, Menlo, monospace" font-size="11">scripts/ecoflow-app-client.mjs</text>
    <text x="24" y="398" fill="#c8d8dc" font-family="ui-monospace, Menlo, monospace" font-size="11">docker compose up -d ecoflow-bridge</text>

    <text x="24" y="434" fill="#6a7a8a" font-family="ui-monospace, Menlo, monospace" font-size="10">Developer API quota/all returns empty - do not merge paths</text>
  </g>

  <text x="600" y="598" text-anchor="middle" fill="#6a7a70" font-family="ui-monospace, Menlo, monospace" font-size="11">gaming_hub_fetch_ecoflow_device_status() | bridge first, then REST</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="EcoFlow quota normalization flow">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a120e"/>
      <stop offset="100%" stop-color="#12100a"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffcb05"/>
    </marker>
  </defs>

  <rect width="1200" height="420" fill="url(#bg3)"/>
  <text x="40" y="42" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="13">QUOTA NORMALIZE</text>

  <g font-family="ui-monospace, Menlo, monospace">
    <rect x="40" y="80" width="180" height="100" rx="10" fill="#101814" stroke="#33443a"/>
    <text x="130" y="118" text-anchor="middle" fill="#c8d8cc" font-size="12">Raw quota map</text>
    <text x="130" y="140" text-anchor="middle" fill="#6a8a74" font-size="10">MQTT JSON or</text>
    <text x="130" y="156" text-anchor="middle" fill="#6a8a74" font-size="10">quota/all response</text>

    <line x1="220" y1="130" x2="268" y2="130" stroke="#ffcb05" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="270" y="80" width="220" height="100" rx="10" fill="#101814" stroke="#00c853"/>
    <text x="380" y="112" text-anchor="middle" fill="#00c853" font-size="11">gaming_hub_ecoflow</text>
    <text x="380" y="130" text-anchor="middle" fill="#00c853" font-size="11">_quota_value()</text>
    <text x="380" y="156" text-anchor="middle" fill="#8aa898" font-size="9">fallback keys | pdStatus to pd</text>

    <line x1="490" y1="130" x2="538" y2="130" stroke="#ffcb05" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="540" y="80" width="220" height="100" rx="10" fill="#101814" stroke="#00c853"/>
    <text x="650" y="112" text-anchor="middle" fill="#c8d8cc" font-size="11">parse_ecoflow_quota()</text>
    <text x="650" y="134" text-anchor="middle" fill="#a8b8ac" font-size="10">battery | input | output</text>
    <text x="650" y="152" text-anchor="middle" fill="#a8b8ac" font-size="10">solar | charge_state</text>

    <line x1="760" y1="130" x2="808" y2="130" stroke="#ffcb05" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="810" y="80" width="170" height="100" rx="10" fill="#101814" stroke="#ffcb05"/>
    <text x="895" y="118" text-anchor="middle" fill="#ffcb05" font-size="12">Dashboard</text>
    <text x="895" y="140" text-anchor="middle" fill="#a8b8ac" font-size="10">React flow | cards</text>
    <text x="895" y="156" text-anchor="middle" fill="#a8b8ac" font-size="10">transient 5s cache</text>

    <line x1="980" y1="130" x2="1028" y2="130" stroke="#ffcb05" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="1030" y="80" width="130" height="100" rx="10" fill="#101814" stroke="#33443a"/>
    <text x="1095" y="118" text-anchor="middle" fill="#c8d8cc" font-size="11">energy.php</text>
    <text x="1095" y="140" text-anchor="middle" fill="#6a8a74" font-size="9">kWh | SAVE JPY</text>
  </g>

  <rect x="40" y="220" width="1120" height="160" rx="12" fill="#0e1410" stroke="#2a3a30"/>
  <text x="64" y="252" fill="#ffcb05" font-family="ui-monospace, Menlo, monospace" font-size="12">bmsChgDsgState to UI label</text>
  <text x="64" y="284" fill="#c8d8cc" font-family="ui-monospace, Menlo, monospace" font-size="11">0 idle/standby - wait state (use with W threshold)</text>
  <text x="64" y="308" fill="#c8d8cc" font-family="ui-monospace, Menlo, monospace" font-size="11">1 discharge - discharging</text>
  <text x="64" y="332" fill="#c8d8cc" font-family="ui-monospace, Menlo, monospace" font-size="11">2 charge - grid/solar charge (split by AC in / PV)</text>
  <text x="64" y="360" fill="#6a8a74" font-family="ui-monospace, Menlo, monospace" font-size="10">W alone is unreliable at idle - tens of watts still move on Pro 3</text>
</svg>

# /etc/nginx/sites-available/shinichiy-gaming-hub.com
# After copy: sudo ln -sf .../sites-available/shinichiy-gaming-hub.com .../sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name shinichiy-gaming-hub.com www.shinichiy-gaming-hub.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://shinichiy-gaming-hub.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shinichiy-gaming-hub.com;

    # certbot --nginx -d shinichiy-gaming-hub.com
    ssl_certificate     /etc/letsencrypt/live/shinichiy-gaming-hub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shinichiy-gaming-hub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    # Tesla Fleet API partner registration (place public-key.pem on server)
    location = /.well-known/appspecific/com.tesla.3p.public-key.pem {
        alias /opt/gaming-hub/tesla/public-key.pem;
        default_type application/x-pem-file;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shinichiy-gaming-hub.com;

    ssl_certificate     /etc/letsencrypt/live/shinichiy-gaming-hub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shinichiy-gaming-hub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://shinichiy-gaming-hub.com$request_uri;
}

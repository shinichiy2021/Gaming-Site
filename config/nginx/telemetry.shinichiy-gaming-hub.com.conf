# Optional: Tesla Fleet Telemetry subdomain (Phase 1).
#
# The car speaks Tesla's TLS stream protocol — NOT plain HTTP.
# Do NOT reverse-proxy this with an nginx "location /" http block.
# Expose host port 8443 (compose maps it to the telemetry container) and
# point DNS A record telemetry.shinichiy-gaming-hub.com → this server.
#
# Firewall:
#   sudo ufw allow 8443/tcp comment 'Tesla Fleet Telemetry'
#
# DNS:
#   telemetry.shinichiy-gaming-hub.com  A  <server-ip>
#
# TLS for the container (preferred):
#   sudo certbot certonly --nginx -d telemetry.shinichiy-gaming-hub.com
#   (or certonly --standalone briefly) then:
#   TESLA_TELEMETRY_CERT_DIR=/etc/letsencrypt/live/telemetry.shinichiy-gaming-hub.com \
#     TESLA_TELEMETRY_HOST=telemetry.shinichiy-gaming-hub.com \
#     bash /opt/gaming-hub/scripts/tesla-telemetry-prepare.sh
#
# If you only need ACME HTTP-01 for this hostname, you can add a temporary
# HTTP server block (optional):

# server {
#     listen 80;
#     listen [::]:80;
#     server_name telemetry.shinichiy-gaming-hub.com;
#
#     location /.well-known/acme-challenge/ {
#         root /var/www/certbot;
#     }
#
#     location / {
#         return 404;
#     }
# }

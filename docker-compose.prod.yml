# Production stack — WordPress listens on localhost:8080; nginx on the host terminates TLS.
services:
  db:
    image: mysql:8.0
    container_name: gaming-site-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - gaming-network

  wordpress:
    image: wordpress:latest
    container_name: gaming-site-wp
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME:-https://shinichiy-gaming-hub.com}');
        define('WP_SITEURL', '${WP_SITEURL:-https://shinichiy-gaming-hub.com}');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
      ECOFLOW_ACCESS_KEY: ${ECOFLOW_ACCESS_KEY:-}
      ECOFLOW_SECRET_KEY: ${ECOFLOW_SECRET_KEY:-}
      ECOFLOW_DEVICE_SN: ${ECOFLOW_DEVICE_SN:-}
      ECOFLOW_DEVICE_SN_2: ${ECOFLOW_DEVICE_SN_2:-}
      ECOFLOW_APP_EMAIL: ${ECOFLOW_APP_EMAIL:-}
      ECOFLOW_APP_PASSWORD: ${ECOFLOW_APP_PASSWORD:-}
      ECOFLOW_API_REGION: ${ECOFLOW_API_REGION:-us}
      SWITCHBOT_TOKEN: ${SWITCHBOT_TOKEN:-}
      SWITCHBOT_SECRET: ${SWITCHBOT_SECRET:-}
      SWITCHBOT_UPS_DEVICE_ID: ${SWITCHBOT_UPS_DEVICE_ID:-}
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:-}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET:-}
      TESLA_VEHICLE_VIN: ${TESLA_VEHICLE_VIN:-}
      TESLA_REFRESH_TOKEN: ${TESLA_REFRESH_TOKEN:-}
      TESLA_FLEET_API_BASE_URL: ${TESLA_FLEET_API_BASE_URL:-https://fleet-api.prd.na.vn.cloud.tesla.com}
      TESLA_REDIRECT_URI: ${TESLA_REDIRECT_URI:-https://shinichiy-gaming-hub.com/wp-json/gaming-hub/v1/tesla/oauth/callback}
      TESLA_PARTNER_DOMAIN: ${TESLA_PARTNER_DOMAIN:-shinichiy-gaming-hub.com}
      TESLA_COMMAND_PROXY_URL: ${TESLA_COMMAND_PROXY_URL:-https://tesla-http-proxy:4443}
      GAMING_HUB_ENERGY_ORIGIN: ${GAMING_HUB_ENERGY_ORIGIN:-}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/gaming-hub:/var/www/html/wp-content/themes/gaming-hub
      - ./wp-content/ecoflow-cache:/var/www/html/wp-content/ecoflow-cache
      - ./scripts:/var/www/html/scripts:ro
      - ./config/.htaccess:/var/www/html/.htaccess
    networks:
      - gaming-network

  # Signs Fleet vehicle commands (charge_start / charge_stop). Not published to the host.
  tesla-http-proxy:
    image: tesla/vehicle-command:latest
    container_name: gaming-site-tesla-proxy
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /config
    environment:
      TESLA_HTTP_PROXY_TLS_CERT: /config/tls-cert.pem
      TESLA_HTTP_PROXY_TLS_KEY: /config/tls-key.pem
      TESLA_HTTP_PROXY_HOST: 0.0.0.0
      TESLA_HTTP_PROXY_PORT: "4443"
      TESLA_HTTP_PROXY_TIMEOUT: 30s
      TESLA_KEY_FILE: /config/fleet-key.pem
      TESLA_CACHE_FILE: /config/session-cache.json
      TESLA_VERBOSE: "true"
    volumes:
      - ./tesla:/config
    command:
      - -tls-key=/config/tls-key.pem
      - -cert=/config/tls-cert.pem
      - -key-file=/config/fleet-key.pem
      - -host=0.0.0.0
      - -port=4443
    security_opt:
      - no-new-privileges:true
    networks:
      - gaming-network

  ecoflow-bridge:
    image: node:20-alpine
    container_name: gaming-site-ecoflow-bridge
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - wordpress
    environment:
      ECOFLOW_CACHE_DIR: /cache
      ECOFLOW_BRIDGE_CONFIG: /cache/bridge-config.json
      ECOFLOW_BRIDGE_INTERVAL_MS: 30000
      ECOFLOW_APP_EMAIL: ${ECOFLOW_APP_EMAIL:-}
      ECOFLOW_APP_PASSWORD: ${ECOFLOW_APP_PASSWORD:-}
      ECOFLOW_DEVICE_SN_2: ${ECOFLOW_DEVICE_SN_2:-}
      ECOFLOW_API_REGION: ${ECOFLOW_API_REGION:-us}
    volumes:
      - ./wp-content/themes/gaming-hub:/app
      - ./wp-content/ecoflow-cache:/cache
    command: sh -c "npm install --omit=dev && node scripts/ecoflow-bridge-daemon.mjs"
    networks:
      - gaming-network

volumes:
  db_data:
  wp_data:

networks:
  gaming-network:
    driver: bridge

name: Deploy to AWS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wp-content/themes/gaming-hub/package-lock.json

      - name: Install gettext (msgfmt for i18n)
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install theme dependencies
        working-directory: wp-content/themes/gaming-hub
        run: npm ci

      - name: Build i18n catalogs
        working-directory: wp-content/themes/gaming-hub
        run: npm run i18n:build

      - name: Build flow bundles
        working-directory: wp-content/themes/gaming-hub
        run: npm run build:flows

      - name: Deploy to EC2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SKIP_BUILD: "1"
        run: ./scripts/deploy.sh

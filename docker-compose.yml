services:
  db:
    image: mysql:8.0
    container_name: gaming-site-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - gaming-network

  wordpress:
    image: wordpress:latest
    container_name: gaming-site-wp
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      ECOFLOW_ACCESS_KEY: ${ECOFLOW_ACCESS_KEY:-}
      ECOFLOW_SECRET_KEY: ${ECOFLOW_SECRET_KEY:-}
      ECOFLOW_DEVICE_SN: ${ECOFLOW_DEVICE_SN:-}
      ECOFLOW_DEVICE_SN_2: ${ECOFLOW_DEVICE_SN_2:-}
      ECOFLOW_APP_EMAIL: ${ECOFLOW_APP_EMAIL:-}
      ECOFLOW_APP_PASSWORD: ${ECOFLOW_APP_PASSWORD:-}
      ECOFLOW_API_REGION: ${ECOFLOW_API_REGION:-us}
      SWITCHBOT_TOKEN: ${SWITCHBOT_TOKEN:-}
      SWITCHBOT_SECRET: ${SWITCHBOT_SECRET:-}
      SWITCHBOT_UPS_DEVICE_ID: ${SWITCHBOT_UPS_DEVICE_ID:-}
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:-}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET:-}
      TESLA_VEHICLE_VIN: ${TESLA_VEHICLE_VIN:-}
      TESLA_REFRESH_TOKEN: ${TESLA_REFRESH_TOKEN:-}
      TESLA_FLEET_API_BASE_URL: ${TESLA_FLEET_API_BASE_URL:-}
      TESLA_REDIRECT_URI: ${TESLA_REDIRECT_URI:-}
      TESLA_COMMAND_PROXY_URL: ${TESLA_COMMAND_PROXY_URL:-}
      GAMING_HUB_ENERGY_ORIGIN: ${GAMING_HUB_ENERGY_ORIGIN:-https://shinichiy-gaming-hub.com}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/gaming-hub:/var/www/html/wp-content/themes/gaming-hub
      - ./wp-content/plugins/seo-by-rank-math:/var/www/html/wp-content/plugins/seo-by-rank-math
      - ./wp-content/ecoflow-cache:/var/www/html/wp-content/ecoflow-cache
      - ./config/.htaccess:/var/www/html/.htaccess
      - ./config/googlee038b6ecd4369c0c.html:/var/www/html/googlee038b6ecd4369c0c.html:ro
    networks:
      - gaming-network

  ecoflow-bridge:
    image: node:20-alpine
    container_name: gaming-site-ecoflow-bridge
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - wordpress
    environment:
      ECOFLOW_CACHE_DIR: /cache
      ECOFLOW_BRIDGE_CONFIG: /cache/bridge-config.json
      ECOFLOW_BRIDGE_INTERVAL_MS: 30000
      ECOFLOW_APP_EMAIL: ${ECOFLOW_APP_EMAIL:-}
      ECOFLOW_APP_PASSWORD: ${ECOFLOW_APP_PASSWORD:-}
      ECOFLOW_DEVICE_SN_2: ${ECOFLOW_DEVICE_SN_2:-}
      ECOFLOW_API_REGION: ${ECOFLOW_API_REGION:-us}
    volumes:
      - ./wp-content/themes/gaming-hub:/app
      # Keep the bridge's --omit=dev install off the host tree, or it prunes vite.
      - bridge_node_modules:/app/node_modules
      - ./wp-content/ecoflow-cache:/cache
    tty: true
    command: sh -c "npm install --omit=dev && node scripts/ecoflow-bridge-daemon.mjs"
    networks:
      - gaming-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gaming-site-pma
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    networks:
      - gaming-network

volumes:
  db_data:
  wp_data:
  bridge_node_modules:

networks:
  gaming-network:
    driver: bridge
